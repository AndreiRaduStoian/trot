[project]
name = "trot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AndreiRaduStoian", email = "andreiradu.stoian@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5.91",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
trot = "trot.main:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]
